<div class="budget-container">
  <form class="new-budget-name-form"
        [formGroup]="newBudgetNameForm" (ngSubmit)="createNewBudget()">
    <label> Budget Name
      <input type="text" formControlName="name">
    </label>
    <button type="submit"
            *ngIf="(currentPage$ | async) === 1"
            [disabled]="!newBudgetNameForm.valid">Create</button>
  </form>
</div>
